version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, server]
    # Bundle all non-breaking updates into ONE PR; majors stay separate so a
    # breaking bump gets its own reviewable PR instead of a wave of them.
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, client]
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]

  # Keep the CI workflow's own actions (checkout/setup-node/...) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      ci-actions-minor-and-patch:
        update-types: [minor, patch]
