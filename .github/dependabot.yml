version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, server]
    # Bundle all non-breaking updates into ONE PR; majors stay separate so a
    # breaking bump gets its own reviewable PR instead of a wave of them.
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, client]
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    # Next.js 15 is a breaking major — deferred deliberately (see SECURITY.md),
    # NOT a permanent dismissal. To be done as a separately-verified migration
    # after the coursework deadline; remove this ignore to let the PR reappear.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # Keep the CI workflow's own actions (checkout/setup-node/...) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      ci-actions-minor-and-patch:
        update-types: [minor, patch]
